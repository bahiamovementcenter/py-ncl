name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        # The oldest and newest supported: the wheel uses the stable ABI.
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip install maturin pytest
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist py-ncl
      # Against the installed wheel, from outside the source tree so `python/ncl` isn't imported.
      - name: Test the installed wheel
        shell: bash
        run: |
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -m pytest tests
